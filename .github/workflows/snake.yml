
name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
     
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emilyshaas
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a78bfa&color_dots=#ebedf0,#d8c8ec,#b9a0d6,#9474b9,#75519d
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a78bfa&color_dots=#34313f,#50445f,#6b5485,#8969ac,#ac8ad5

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
